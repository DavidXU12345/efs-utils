# Continuous integration for efs-utils.
#
# Runs the Python unit test suite across the supported interpreter versions and
# builds + installs the DEB, RPM, and SUSE RPM packages across the supported
# distributions, verifying each install with `mount.efs --version`.
#
# Jobs run inside the per-matrix container image (the same images the previous
# CI system used), so the apt/yum/zypper toolchain setup below runs against the
# target distribution exactly as it would on that distribution.
name: CI

on: [push, pull_request]

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: python3_10
            image: python:3.10.13
          - name: python3_11
            image: python:3.11.9
          - name: python3_12
            image: python:3.12.4
          - name: python3_13
            image: python:3.13.12
          - name: python3_14
            image: python:3.14.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Python dependencies in a virtual env
        run: |
          pip install --upgrade pip
          pip install virtualenv
          virtualenv -p $(which python) ~/efs-utils-virtualenv
          source ~/efs-utils-virtualenv/bin/activate
          pip install -r requirements.txt
      - name: Run all tests
        run: |
          source ~/efs-utils-virtualenv/bin/activate
          make test
      - name: Store artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.name }}
          path: build
          if-no-files-found: ignore

  build-deb-package:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu18
            image: ubuntu:18.04
            old_glibc: true
          - name: ubuntu20
            image: ubuntu:20.04
          - name: ubuntu22
            image: ubuntu:22.04
          - name: ubuntu24
            image: ubuntu:24.04
          - name: debian11
            image: debian:bullseye
          - name: debian12
            image: debian:bookworm
          - name: debian13
            image: debian:trixie
    steps:
      - name: Repo update
        run: |
          apt-get update
      - name: Install curl
        run: |
          apt-get -y install curl
      - name: Install latest Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          . "$HOME/.cargo/env"
      - name: Install golang
        if: ${{ !matrix.old_glibc }}
        uses: actions/setup-go@0c52d547c9bc32b1aa3301fd7a9cb496313a4491 # v5.0.0
        with:
          go-version: 'stable'
          cache: false
      - name: Install golang (node16)
        if: ${{ matrix.old_glibc }}
        uses: actions/setup-go@93397bea11091df50f3d7e59dc26a7711a8bcfbe # v4.1.0
        with:
          go-version: 'stable'
          cache: false
      - name: Install dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends tzdata
          if grep -q 'Ubuntu 20.04' /etc/os-release 2>/dev/null; then
            apt-get -y install binutils git rustc cargo pkg-config libssl-dev gettext cmake gcc-10 g++-10
            update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-10 100
            update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-10 100
          elif grep -q 'trixie' /etc/os-release 2>/dev/null; then
            apt-get -y install binutils git rustc cargo pkg-config libssl-dev gettext cmake gcc-13 g++-13
          else
            apt-get -y install binutils git rustc cargo pkg-config libssl-dev gettext cmake gcc g++
          fi
      - name: Add local build repo as safe git directory
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Checkout
        if: ${{ !matrix.old_glibc }}
        uses: actions/checkout@v4
      - name: Checkout (node16)
        if: ${{ matrix.old_glibc }}
        uses: actions/checkout@v3
      - name: Build DEB
        run: |
          . "$HOME/.cargo/env"
          export PATH=$PATH:/usr/local/go/bin
          if grep -q 'trixie' /etc/os-release 2>/dev/null; then
            export CC=gcc-13
            export CXX=g++-13
          fi
          rustc --version
          cargo --version
          go version
          cmake --version
          ./build-deb.sh
      - name: Install package
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get -y install --fix-missing ./build/amazon-efs-utils*deb
      - name: Check installed successfully
        run: |
          mount.efs --version

  build-rpm-package:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: rocky8
            image: rockylinux/rockylinux:8
          - name: amazon-linux-latest
            image: amazonlinux:latest
          - name: amazon-linux-2
            image: amazonlinux:2
            old_glibc: true
    steps:
      - name: Checkout
        if: ${{ !matrix.old_glibc }}
        uses: actions/checkout@v4
      - name: Checkout (node16)
        if: ${{ matrix.old_glibc }}
        uses: actions/checkout@v3
      - name: Install latest Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      - name: Install golang
        if: ${{ !matrix.old_glibc }}
        uses: actions/setup-go@0c52d547c9bc32b1aa3301fd7a9cb496313a4491 # v5.0.0
        with:
          go-version: 'stable'
          cache: false
      - name: Install golang (node16)
        if: ${{ matrix.old_glibc }}
        uses: actions/setup-go@93397bea11091df50f3d7e59dc26a7711a8bcfbe # v4.1.0
        with:
          go-version: 'stable'
          cache: false
      - name: Install dependencies
        run: |
          if grep -q '^ID="amzn"' /etc/os-release && grep -q '^VERSION_ID="2"' /etc/os-release 2>/dev/null; then
            yum -y install rpm-build make systemd rust cargo openssl-devel cmake3 gcc gcc-c++ perl binutils
            if [ ! -e /usr/bin/cmake ]; then
              ln -sf /usr/bin/cmake3 /usr/bin/cmake
            fi
          else
            yum -y install rpm-build make systemd rust cargo openssl-devel cmake gcc gcc-c++ perl binutils
          fi
      - name: Build RPM
        run: |
          . "$HOME/.cargo/env"
          export PATH=$PATH:/usr/local/go/bin
          rustc --version
          go version
          cmake --version
          make rpm
      - name: Install package
        run: |
          yum -y install build/amazon-efs-utils*rpm
      - name: Check installed successfully
        run: |
          mount.efs --version
      - name: Check changelog
        run: |
          rpm -q --changelog amazon-efs-utils

  build-suse-rpm-package:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: opensuse-leap15.1
            image: opensuse/leap:15.1
            old_glibc: true
          - name: opensuse-leap15.2
            image: opensuse/leap:15.2
            old_glibc: true
          - name: opensuse-leap15.3
            image: opensuse/leap:15.3
          - name: opensuse-leap15.4
            image: opensuse/leap:15.4
          - name: opensuse-leap-latest
            image: opensuse/leap:latest
          - name: opensuse-tumbleweed
            image: opensuse/tumbleweed
    steps:
      - name: Checkout
        if: ${{ !matrix.old_glibc }}
        uses: actions/checkout@v4
      - name: Checkout (node16)
        if: ${{ matrix.old_glibc }}
        uses: actions/checkout@v3
      - name: Refresh source
        run: |
          zypper refresh
      - name: Install curl
        run: |
          zypper install -y curl
      - name: Install latest Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      - name: Install golang
        if: ${{ !matrix.old_glibc }}
        uses: actions/setup-go@0c52d547c9bc32b1aa3301fd7a9cb496313a4491 # v5.0.0
        with:
          go-version: 'stable'
          cache: false
      - name: Install golang (node16)
        if: ${{ matrix.old_glibc }}
        uses: actions/setup-go@93397bea11091df50f3d7e59dc26a7711a8bcfbe # v4.1.0
        with:
          go-version: 'stable'
          cache: false
      - name: Install dependencies
        run: |
          zypper install -y --force-resolution rpm-build
          if grep -q 'Tumbleweed' /etc/os-release 2>/dev/null; then
            zypper install -y make systemd rust cargo openssl-devel cmake gcc13 gcc13-c++ perl binutils
          else
            zypper install -y make systemd rust cargo openssl-devel cmake gcc gcc-c++ perl binutils
          fi
      - name: Build RPM
        run: |
          . "$HOME/.cargo/env"
          export PATH=$PATH:/usr/local/go/bin
          if grep -q 'Tumbleweed' /etc/os-release 2>/dev/null; then
            export CC=gcc-13
            export CXX=g++-13
          fi
          rustc --version
          go version
          cmake --version
          make rpm
      - name: Install package
        run: |
          zypper --no-gpg-checks install -y build/amazon-efs-utils*rpm
      - name: Check installed successfully
        run: |
          mount.efs --version
      - name: Check changelog
        run: |
          rpm -q --changelog amazon-efs-utils
